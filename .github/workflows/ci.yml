# CI: lint, format check, offline tests with coverage, dependency audit. No API keys needed.
name: CI

on:
  pull_request:
  push:
    branches: [main, "refactor/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest -q --cov=insider_intel --cov-report=term-missing
      - name: Dependency audit
        # Informational at first; flip to blocking once the baseline is clean.
        continue-on-error: true
        run: pip-audit
